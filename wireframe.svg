  <text x="292" y="120" fill="#222">LOGO</text>
  <text x="640" y="120" fill="#222">Нүүр</text><text x="700" y="120" fill="#222">Үйлчилгээ</text><text x="780" y="120" fill="#222">Бидний тухай</text><text x="880" y="120" fill="#222">Холбоо</text>
  <!-- hero -->
  <rect x="280" y="143" width="680" height="110" fill="#e8e8e8" stroke="#555"/>
  <text x="620" y="193" text-anchor="middle" fill="#222" font-size="16">HERO гарчиг</text>
  <rect x="580" y="208" width="80" height="26" fill="#fff" stroke="#555"/><text x="620" y="226" text-anchor="middle" font-size="11">Товч</text>
