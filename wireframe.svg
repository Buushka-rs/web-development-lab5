  <rect x="30" y="238" width="200" height="50" fill="#f0f0f0" stroke="#555"/><text x="130" y="268" text-anchor="middle">Карт 1</text>
  <rect x="30" y="296" width="200" height="50" fill="#f0f0f0" stroke="#555"/><text x="130" y="326" text-anchor="middle">Карт 2</text>
  <rect x="30" y="354" width="200" height="50" fill="#f0f0f0" stroke="#555"/><text x="130" y="384" text-anchor="middle">Карт 3</text>
