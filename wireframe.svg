  <rect x="280" y="263" width="216" height="90" fill="#f0f0f0" stroke="#555"/><text x="388" y="313" text-anchor="middle">Карт 1</text>
  <rect x="512" y="263" width="216" height="90" fill="#f0f0f0" stroke="#555"/><text x="620" y="313" text-anchor="middle">Карт 2</text>
  <rect x="744" y="263" width="216" height="90" fill="#f0f0f0" stroke="#555"/><text x="852" y="313" text-anchor="middle">Карт 3</text>
  <!-- about 2 col -->
