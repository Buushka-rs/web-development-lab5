  <!-- form -->
  <rect x="30" y="520" width="200" height="45" fill="#f7f7f7" stroke="#555"/><text x="130" y="547" text-anchor="middle">Холбоо барих форм</text>
  <rect x="30" y="572" width="200" height="25" fill="#ddd" stroke="#555"/><text x="130" y="589" text-anchor="middle" font-size="11">FOOTER</text>

